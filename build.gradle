buildscript {
  repositories {
    mavenCentral()
    gradlePluginPortal()
    mavenLocal()
    google()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
  }
  dependencies {


  }
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  // This allows you to "Build and run using IntelliJ IDEA", an option in IDEA's Settings.
  idea {
    module {
      outputDir = file('build/classes/java/main')
      testOutputDir = file('build/classes/java/test')
    }
  }
}

configure(subprojects) {
  apply plugin: 'java-library'
  java.sourceCompatibility = 8
  java.targetCompatibility = 8

  // From https://lyze.dev/2021/04/29/libGDX-Internal-Assets-List/
  // The article can be helpful when using assets.txt in your project.
  tasks.register('generateAssetList') {
    inputs.dir("${project.rootDir}/assets/")
    // projectFolder/assets
    File assetsFolder = new File("${project.rootDir}/assets/")
    // projectFolder/assets/assets.txt
    File assetsFile = new File(assetsFolder, "assets.txt")
    // delete that file in case we've already created it
    assetsFile.delete()

    // iterate through all files inside that folder
    // convert it to a relative path
    // and append it to the file assets.txt
    fileTree(assetsFolder).collect { assetsFolder.relativePath(it) }.sort().each {
      assetsFile.append(it + "\n")
    }
  }
  processResources.dependsOn 'generateAssetList'

  compileJava {
    options.incremental = true
  }
}

subprojects {
  version = "$projectVersion"
  ext.appName = 'RAMSHI'
  repositories {
    mavenCentral()
    // You may want to remove the following line if you have errors downloading dependencies.
    mavenLocal()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
    maven { url = 'https://jitpack.io' }
  }
}

eclipse.project.name = 'RAMSHI' + '-parent'

// ---------------------------------------------------------------------------
// Carpeta "Ejecutables": deja a mano el .exe del juego y el del servidor (con Java incluido)
// y, en Windows, un acceso directo a cada uno. Se arma con: gradlew ejecutables
// ---------------------------------------------------------------------------
def carpetaEjecutables = file('Ejecutables')

tasks.register('ejecutableJuego', Sync) {
  group = 'build'
  dependsOn ':lwjgl3:packageWinX64'
  from { zipTree(file('lwjgl3/build/construo/dist/RAMSHI-winX64.zip')) }
  into new File(carpetaEjecutables, 'Juego')
}

tasks.register('ejecutableServidor', Sync) {
  group = 'build'
  dependsOn ':server:packageWinX64'
  from { zipTree(file('server/build/construo/dist/RAMSHI-Servidor-winX64.zip')) }
  into new File(carpetaEjecutables, 'Servidor')
}

tasks.register('ejecutables') {
  group = 'build'
  description = 'Arma la carpeta Ejecutables con el juego, el servidor y sus accesos directos.'
  dependsOn 'ejecutableJuego', 'ejecutableServidor'
  def carpeta = carpetaEjecutables
  doLast {
    if (!System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) return
    def accesos = [
      'RAMSHI - Juego'   : new File(carpeta, 'Juego/RAMSHI.exe'),
      'RAMSHI - Servidor': new File(carpeta, 'Servidor/RAMSHI-Servidor.exe'),
    ]
    def script = new StringBuilder('$s = New-Object -ComObject WScript.Shell; ')
    accesos.each { nombre, exe ->
      def lnk = new File(carpeta, nombre + '.lnk').absolutePath.replace("'", "''")
      def destino = exe.absolutePath.replace("'", "''")
      def dir = exe.parentFile.absolutePath.replace("'", "''")
      script.append("\$a = \$s.CreateShortcut('${lnk}'); \$a.TargetPath = '${destino}'; ")
        .append("\$a.WorkingDirectory = '${dir}'; \$a.IconLocation = '${destino},0'; \$a.Save(); ")
    }
    def proceso = new ProcessBuilder('powershell', '-NoProfile', '-NonInteractive', '-Command', script.toString())
      .redirectErrorStream(true).start()
    def salida = proceso.inputStream.text
    if (proceso.waitFor() != 0) throw new GradleException('No se pudieron crear los accesos directos: ' + salida)
    println "Listo: ${carpeta.absolutePath}"
  }
}
